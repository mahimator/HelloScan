name: helloscan
description: Temporary business card scanning and CRM-ready JSON export.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  tflite_flutter: ^0.10.0
  image: ^4.2.0
  http: ^1.2.1
  path_provider: ^2.1.1
  path: ^1.9.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/labels.txt
